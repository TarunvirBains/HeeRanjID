[workspace]
members = ["heeranjid", "heeranjid-sqlx", "bindings/python", "bindings/typescript", "heeranjid-ffi", "xtask"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TarunvirBains/HeeRanjID"
authors = ["Tarunvir Bains"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "uuid", "runtime-tokio-rustls", "macros", "time"] }
bytes = "1"
postgres-types = { version = "0.2", default-features = false, features = ["with-uuid-1"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
serde_json = "1"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
