[package]
name = "heeranjid-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/heeranjid-ffi"
description = "C FFI bindings for HeeRanjID distributed ID generation"
keywords = ["distributed", "id", "ffi", "c"]
categories = ["api-bindings"]
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
heeranjid = { version = "0.2", path = "../heeranjid", default-features = false }
uuid = "1"

[features]
default = []
include-sql = []

[build-dependencies]
cbindgen = "0.28"
