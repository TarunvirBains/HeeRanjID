[package]
name = "heeranjid-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "C FFI bindings for HeeRanjID distributed ID generation"
repository = "https://github.com/TarunvirBains/HeeRanjID"
keywords = ["distributed", "id", "ffi", "c"]
categories = ["api-bindings"]

[lib]
crate-type = ["cdylib"]

[dependencies]
heeranjid = { path = "../heeranjid", default-features = false }
uuid = "1"

[features]
default = []
include-sql = []

[build-dependencies]
cbindgen = "0.28"
