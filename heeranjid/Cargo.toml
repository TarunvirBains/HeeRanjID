[package]
name = "heeranjid"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/heeranjid"
description = "Distributed ID generation — HeerId (64-bit) and RanjId (128-bit UUIDv8) with configurable precision"
keywords = ["distributed", "id", "uuid", "snowflake", "heerid"]
categories = ["data-structures", "database"]
readme = "README.md"

[features]
default = []
sqlx = ["dep:sqlx"]
postgres = ["dep:postgres-types", "dep:bytes", "dep:tokio-postgres"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
sqlx = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
sqlx.workspace = true
tokio-postgres.workspace = true
tokio.workspace = true

[[example]]
name = "migrate_asc_to_desc"
required-features = ["sqlx", "postgres"]

[[example]]
name = "migrate_asc_to_desc_with_fk"
required-features = ["sqlx", "postgres"]
