[package]
name = "heeranjid"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/heeranjid"
description = "Rust Snowflake-style distributed ID generator: 64-bit sortable bigint IDs and UUIDv8-compatible 128-bit IDs for Postgres and MSSQL, with SQLx, Django, and cross-language ORM support."
keywords = ["snowflake", "uuid", "id-generator", "postgres", "mssql"]
categories = ["database", "data-structures", "algorithms"]
readme = "README.md"

[features]
default = []
sqlx = ["dep:sqlx"]
postgres = ["dep:postgres-types", "dep:bytes", "dep:tokio-postgres"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
sqlx = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
postcard.workspace = true
sqlx.workspace = true
tokio-postgres.workspace = true
tokio.workspace = true
serial_test = "3"

[[example]]
name = "migrate_asc_to_desc"
required-features = ["sqlx", "postgres"]

[[example]]
name = "migrate_asc_to_desc_with_fk"
required-features = ["sqlx", "postgres"]
