name: Publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - heeranjid (crates.io)
          - heeranjid-sqlx (crates.io)
          - heeranjid-ffi (crates.io)
          - heeranjid (PyPI)
          - heeranjid-django (PyPI)

jobs:
  publish-crate:
    if: contains(github.event.inputs.package, 'crates.io')
    runs-on: ubuntu-latest
    container:
      image: rust:1.94-slim-bookworm
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE_INPUT: ${{ github.event.inputs.package }}
        run: |
          CRATE=$(echo "$PACKAGE_INPUT" | cut -d' ' -f1)
          cargo publish -p "$CRATE"

  publish-pypi-linux:
    if: contains(github.event.inputs.package, 'heeranjid (PyPI)')
    runs-on: ubuntu-latest
    container:
      image: rust:1.94-slim-bookworm
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git python3 python3-pip python3-venv
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install maturin and twine
        run: pip install maturin twine --break-system-packages
      - name: Build and publish Linux wheel
        run: |
          cd bindings/python
          mkdir -p python/heeranjid/sql/postgres python/heeranjid/sql/mssql
          cp ../../sql/postgres/schema.sql ../../sql/postgres/seed.sql ../../sql/postgres/install.sql python/heeranjid/sql/postgres/
          cp ../../sql/postgres/functions/*.sql python/heeranjid/sql/postgres/
          cp ../../sql/mssql/schema.sql ../../sql/mssql/seed.sql ../../sql/mssql/install.sql python/heeranjid/sql/mssql/
          cp ../../sql/mssql/procedures/*.sql python/heeranjid/sql/mssql/
          maturin build --release
          twine upload ../../target/wheels/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-pypi-windows:
    if: contains(github.event.inputs.package, 'heeranjid (PyPI)')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin and twine
        run: pip install maturin twine
      - name: Copy SQL files
        shell: bash
        run: |
          mkdir -p bindings/python/python/heeranjid/sql/postgres
          mkdir -p bindings/python/python/heeranjid/sql/mssql
          cp sql/postgres/schema.sql sql/postgres/seed.sql sql/postgres/install.sql bindings/python/python/heeranjid/sql/postgres/
          cp sql/postgres/functions/*.sql bindings/python/python/heeranjid/sql/postgres/
          cp sql/mssql/schema.sql sql/mssql/seed.sql sql/mssql/install.sql bindings/python/python/heeranjid/sql/mssql/
          cp sql/mssql/procedures/*.sql bindings/python/python/heeranjid/sql/mssql/
      - name: Build and publish Windows wheel
        run: |
          cd bindings/python
          maturin build --release
          twine upload ../../target/wheels/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-pypi-django:
    if: contains(github.event.inputs.package, 'heeranjid-django (PyPI)')
    runs-on: ubuntu-latest
    container:
      image: rust:1.94-slim-bookworm
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git python3 python3-pip python3-venv
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: pip install maturin twine hatchling build --break-system-packages
      - name: Build and publish heeranjid-django
        run: |
          cd bindings/python/django
          python3 -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
