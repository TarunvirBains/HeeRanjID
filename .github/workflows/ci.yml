name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (lint, test, build artifacts)
    runs-on: ubuntu-latest
    container:
      image: rust:1.94-slim-bookworm

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: heeranjid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git curl make python3 python3-pip python3-venv nodejs npm

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust tools
        run: |
          rustup component add rustfmt clippy
          DENY_VERSION=$(curl -sL https://api.github.com/repos/EmbarkStudios/cargo-deny/releases/latest | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -sL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /usr/local/bin --strip-components=1 --wildcards '*/cargo-deny'

      - name: Install build tools
        run: |
          pip install maturin --break-system-packages
          npm install -g @napi-rs/cli

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      # Lint
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude heeranjid-python --exclude heeranjid-node -- -D warnings

      - name: cargo deny check
        run: cargo deny check

      # Test
      - name: cargo test (unit)
        run: cargo test -p heeranjid --lib

      - name: cargo test (integration)
        run: cargo test -p heeranjid-sqlx --test postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      - name: cargo test (concurrency)
        run: cargo test -p heeranjid-sqlx --test concurrency
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      # Build binding artifacts
      - name: Build Python wheel
        run: cd bindings/python && make build
        env:
          PYO3_PYTHON: python3

      - name: Build TypeScript native module
        run: cd bindings/typescript && npm install && npm run build

      - name: Build FFI shared library
        run: |
          cargo build -p heeranjid-ffi --release
          mkdir -p ffi-out
          cp target/release/libheeranjid_ffi.so ffi-out/
          cp heeranjid-ffi/heeranjid.h ffi-out/

      # Upload artifacts
      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: target/wheels/*.whl

      - name: Upload TypeScript native module
        uses: actions/upload-artifact@v4
        with:
          name: typescript-native
          path: |
            bindings/typescript/heeranjid.*.node
            bindings/typescript/index.js
            bindings/typescript/index.d.ts

      - name: Upload FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffi-linux-x64
          path: ffi-out/

  python:
    name: Python tests
    needs: rust
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim-bookworm

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: heeranjid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: HeeRanjID_Test1
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P HeeRanjID_Test1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Install ODBC driver
        run: |
          apt-get install -y curl gnupg2
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql-release.list
          apt-get update
          ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Python wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist/

      - name: Install packages
        run: |
          pip install dist/*.whl
          pip install -e bindings/python/django/
          pip install pytest django psycopg2-binary pyodbc

      - name: Run core tests
        run: pytest bindings/python/tests/ -v

      - name: Run Django field tests
        run: pytest bindings/python/django/tests/test_django_fields.py -v

      - name: Run Postgres integration tests
        run: pytest bindings/python/django/tests/test_postgres_integration.py -v
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      - name: Run MSSQL integration tests
        run: pytest bindings/python/django/tests/test_mssql_integration.py -v
        env:
          MSSQL_URL: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;UID=sa;PWD=HeeRanjID_Test1;TrustServerCertificate=yes"

  typescript:
    name: TypeScript tests
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download native module
        uses: actions/download-artifact@v4
        with:
          name: typescript-native
          path: bindings/typescript/

      - name: Install and test
        run: |
          cd bindings/typescript
          npm install
          npm test

  dotnet:
    name: .NET tests
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Download FFI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffi-linux-x64
          path: ffi-artifacts/

      - name: Run tests
        run: dotnet test bindings/dotnet/tests/HeeRanjID.Tests/
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ffi-artifacts
