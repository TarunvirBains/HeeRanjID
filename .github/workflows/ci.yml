name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust (lint, test, build artifacts)
    runs-on: ubuntu-latest
    container:
      image: rust:1.94-slim-bookworm

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: heeranjid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git curl make python3 python3-pip python3-venv nodejs npm

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust tools
        run: |
          rustup component add rustfmt clippy
          DENY_VERSION=$(curl -sL https://api.github.com/repos/EmbarkStudios/cargo-deny/releases/latest | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          curl -sL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /usr/local/bin --strip-components=1 --wildcards '*/cargo-deny'

      - name: Set up Node.js for N-API build
        uses: actions/setup-node@v4
        with:
          # Pinned to the floor declared by `engines.node` in
          # bindings/typescript/package.json (the package this step
          # installs and builds via `napi build`). A lower minor would
          # raise `EBADENGINE` on `npm install` and skip Node 20+-only
          # behavior the package depends on.
          node-version: "20.19"

      - name: Install build tools
        run: |
          pip install maturin --break-system-packages

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      # Lint
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude heeranjid-python --exclude heeranjid-node -- -D warnings

      - name: cargo deny check
        run: cargo deny check

      - name: cargo xtask check-test-surface
        run: cargo xtask check-test-surface

      # Test
      - name: cargo test (unit)
        run: cargo test -p heeranjid --lib

      - name: cargo test (heeranjid-sqlx integration)
        run: cargo test -p heeranjid-sqlx -- --test-threads=1
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      - name: cargo test (heeranjid postgres features)
        run: cargo test -p heeranjid --features postgres --features sqlx --tests -- --test-threads=1
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      - name: cargo run example (migrate_asc_to_desc)
        run: cargo run -p heeranjid --features sqlx --features postgres --example migrate_asc_to_desc
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      - name: cargo run example (migrate_asc_to_desc_with_fk)
        run: cargo run -p heeranjid --features sqlx --features postgres --example migrate_asc_to_desc_with_fk
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      # Build binding artifacts
      - name: Build Python wheel
        run: cd bindings/python && make build
        env:
          PYO3_PYTHON: python3

      - name: Build TypeScript native module
        run: |
          cd bindings/typescript
          npm install
          npm exec --yes --package @napi-rs/cli@3.6.2 -- napi build --platform --release

      - name: Build FFI shared library
        run: |
          cargo build -p heeranjid-ffi --release
          mkdir -p ffi-out
          cp target/release/libheeranjid_ffi.so ffi-out/
          cp heeranjid-ffi/heeranjid.h ffi-out/

      # Upload artifacts
      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: target/wheels/*.whl

      - name: Upload TypeScript native module
        uses: actions/upload-artifact@v4
        with:
          name: typescript-native
          path: |
            bindings/typescript/heeranjid.*.node
            bindings/typescript/index.js
            bindings/typescript/index.d.ts

      - name: Upload FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffi-linux-x64
          path: ffi-out/

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-deny
        shell: bash
        run: |
          VERSION=$(curl -sL https://api.github.com/repos/EmbarkStudios/cargo-deny/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          if [[ "$(uname -s)" == "Linux" ]]; then
            curl -sL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/cargo-deny-${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
              | tar xz --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/cargo-deny'
          else
            curl -sL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/cargo-deny-${VERSION}-x86_64-pc-windows-msvc.tar.gz" \
              | tar xz --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/cargo-deny.exe'
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude heeranjid-python --exclude heeranjid-node -- -D warnings

      - name: cargo xtask check-test-surface
        run: cargo xtask check-test-surface

      - name: cargo test (unit)
        run: cargo test -p heeranjid --lib

      - name: Build FFI
        shell: bash
        run: |
          cargo build -p heeranjid-ffi --release
          mkdir -p ffi-out
          if [[ "$(uname -s)" == "Linux" ]]; then
            cp target/release/libheeranjid_ffi.so ffi-out/
          else
            cp target/release/heeranjid_ffi.dll ffi-out/
          fi
          cp heeranjid-ffi/heeranjid.h ffi-out/

      - name: Install Python and maturin
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install maturin

      - name: Build Python wheel (Windows)
        shell: bash
        run: |
          rm -rf target/wheels
          mkdir -p target/wheels
          mkdir -p bindings/python/python/heeranjid/sql/postgres
          mkdir -p bindings/python/python/heeranjid/sql/mssql
          cp sql/postgres/schema.sql sql/postgres/seed.sql sql/postgres/install.sql bindings/python/python/heeranjid/sql/postgres/
          cp sql/postgres/functions/*.sql bindings/python/python/heeranjid/sql/postgres/
          cp sql/mssql/schema.sql sql/mssql/seed.sql sql/mssql/install.sql bindings/python/python/heeranjid/sql/mssql/
          cp sql/mssql/procedures/*.sql bindings/python/python/heeranjid/sql/mssql/
          cd bindings/python
          maturin build --release

      - name: Upload Windows FFI
        uses: actions/upload-artifact@v4
        with:
          name: ffi-windows-x64
          path: ffi-out/

      - name: Upload Windows Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-windows
          path: target/wheels/*.whl

  python:
    name: Python tests
    needs: rust
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim-bookworm

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: heeranjid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: HeeRanjID_Test1
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P HeeRanjID_Test1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Install ODBC driver
        run: |
          apt-get install -y curl gnupg2
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql-release.list
          apt-get update
          ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Python wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist/

      - name: Install packages
        run: |
          pip install dist/*.whl
          pip install -e bindings/python/django/
          pip install pytest pytest-django pytest-playwright django psycopg2-binary pyodbc

      - name: Install lint tools
        run: pip install ruff mypy pip-audit pip-licenses

      - name: Ruff check
        run: |
          ruff check bindings/python/python/ bindings/python/django/src/
          ruff format --check bindings/python/python/ bindings/python/django/src/

      - name: Type check
        run: mypy bindings/python/python/heeranjid/ --ignore-missing-imports

      - name: Security audit
        run: |
          pip install --upgrade pip wheel
          pip-audit --skip-editable

      - name: License check
        run: pip-licenses --partial-match --fail-on="GPL-3;GPL-2;AGPL;SSPL;BUSL"

      - name: Run core tests
        run: pytest bindings/python/tests/ -v

      - name: Run Django unit tests
        run: pytest bindings/python/django/tests/test_django_fields.py bindings/python/django/tests/test_forms.py bindings/python/django/tests/test_managers.py bindings/python/django/tests/test_mixins.py bindings/python/django/tests/test_operations.py -v

      - name: Run mixin comparison tests (no DB)
        run: pytest bindings/python/django/tests/test_mixin_comparison.py -v -k "not TestDbCreation"

      - name: Run Postgres integration tests
        run: pytest bindings/python/django/tests/test_postgres_integration.py bindings/python/django/tests/test_django_orm.py -v
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      - name: Run mixin comparison DB tests
        run: |
          cd bindings/python/django/tests
          pytest test_mixin_comparison.py::TestDbCreation -v
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Playwright admin E2E tests
        run: |
          cd bindings/python/django/tests
          pytest test_admin_playwright.py -v
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid

      - name: Run MSSQL integration tests
        run: pytest bindings/python/django/tests/test_mssql_integration.py -v
        env:
          MSSQL_URL: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;UID=sa;PWD=HeeRanjID_Test1;TrustServerCertificate=yes"

      - name: Run MSSQL desc integration tests (v0.3.1)
        run: pytest bindings/python/django/tests/test_mssql_desc_integration.py -v
        env:
          MSSQL_URL: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;UID=sa;PWD=HeeRanjID_Test1;TrustServerCertificate=yes"

      - name: Run cross-vendor mask equivalence tests (v0.3.1)
        run: pytest bindings/python/django/tests/test_cross_vendor_desc_equivalence.py -v
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/heeranjid
          MSSQL_URL: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;UID=sa;PWD=HeeRanjID_Test1;TrustServerCertificate=yes"

      - name: Run Django desc field unit tests (v0.3.1)
        run: pytest bindings/python/django/tests/test_heeranjid_desc_fields.py bindings/python/django/tests/test_direction_flip_operation.py -v

  python-windows:
    name: Python tests (Windows)
    needs: rust-windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Windows Python wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-windows
          path: dist/

      - name: Install packages
        shell: bash
        run: |
          pip install dist/*.whl
          pip install -e bindings/python/django/
          pip install pytest django pyodbc

      - name: Run core tests
        run: pytest bindings/python/tests/ -v

      - name: Run Django unit tests
        run: pytest bindings/python/django/tests/test_django_fields.py bindings/python/django/tests/test_forms.py bindings/python/django/tests/test_managers.py bindings/python/django/tests/test_mixins.py bindings/python/django/tests/test_operations.py -v

  typescript:
    name: TypeScript tests
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must satisfy `engines.node >=20.19` declared in
          # bindings/typescript/package.json and
          # bindings/typescript/prisma/package.json. Anything older raises
          # `EBADENGINE` on npm install and skips real Node 20+ behavior
          # (e.g. `import.meta.url` interop) that the prisma extension relies on.
          node-version: "20.19"

      - name: Download native module
        uses: actions/download-artifact@v4
        with:
          name: typescript-native
          path: bindings/typescript/

      - name: Install and test
        run: |
          cd bindings/typescript
          npm install
          npm test

      - name: Install Prisma extension
        run: |
          cd bindings/typescript/prisma
          npm install

      # The `@ts-expect-error` regression guards in
      # bindings/typescript/prisma/tests/prisma.test.ts only have teeth if
      # something actually runs `tsc` over the tests. Vitest uses esbuild
      # which does NOT enforce TypeScript types, so without this step a
      # future refactor that relaxed (e.g.) `WithAutoIdsConfig.backend`
      # back to optional would leave the runtime test passing while the
      # contract silently regressed. `npm run typecheck:tests` invokes
      # `tsc -p tsconfig.test.json` which compiles both src/**/*.ts and
      # tests/**/*.ts with `strict: true`, surfacing TS2578 ("Unused
      # '@ts-expect-error' directive") on contract regressions.
      - name: Typecheck Prisma extension tests
        run: |
          cd bindings/typescript/prisma
          npm run typecheck:tests

      - name: Test Prisma extension
        run: |
          cd bindings/typescript/prisma
          npm test

  dotnet-windows:
    name: .NET tests (Windows)
    needs: rust-windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Download Windows FFI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffi-windows-x64
          path: ffi-artifacts/

      - name: Add FFI to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/ffi-artifacts" >> "$GITHUB_PATH"

      - name: Run tests
        run: dotnet test bindings/dotnet/tests/HeeRanjID.Tests/
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ffi-artifacts

  dotnet:
    name: .NET tests
    needs: rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Download FFI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffi-linux-x64
          path: ffi-artifacts/

      - name: Debug FFI artifacts
        run: find ffi-artifacts/ -type f && ls -la ffi-artifacts/

      - name: Run tests
        run: dotnet test bindings/dotnet/tests/HeeRanjID.Tests/
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/ffi-artifacts:${{ github.workspace }}/ffi-artifacts/ffi-out
