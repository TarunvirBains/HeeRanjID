[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "heeranjid"
version = "0.5.0"
description = "Python Snowflake-style distributed ID generator: 64-bit sortable bigint IDs and UUIDv8-compatible 128-bit IDs for Postgres and MSSQL, with Django and cross-language ORM support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [
    { name = "Tarunvir Bains" },
]
keywords = ["snowflake", "uuid", "id-generator", "postgres", "mssql", "django"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "maturin>=1.0"]

[project.urls]
Homepage = "https://github.com/TarunvirBains/HeeRanjID"
Repository = "https://github.com/TarunvirBains/HeeRanjID"
Issues = "https://github.com/TarunvirBains/HeeRanjID/issues"

[tool.maturin]
python-source = "python"
module-name = "heeranjid._heeranjid"
features = ["pyo3/extension-module"]
include = ["python/heeranjid/sql/**/*.sql"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
