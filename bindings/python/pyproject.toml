[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "heeranjid"
version = "0.3.6"
description = "Distributed ID generation — HeerId (64-bit) and RanjId (128-bit UUIDv8) with configurable precision"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Tarunvir Bains" },
]
keywords = ["distributed", "id", "uuid", "snowflake", "heerid"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "maturin>=1.0"]

[project.urls]
Homepage = "https://github.com/TarunvirBains/HeeRanjID"
Repository = "https://github.com/TarunvirBains/HeeRanjID"
Issues = "https://github.com/TarunvirBains/HeeRanjID/issues"

[tool.maturin]
python-source = "python"
module-name = "heeranjid._heeranjid"
features = ["pyo3/extension-module"]
include = ["python/heeranjid/sql/**/*.sql"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
