[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heeranjid-django"
version = "0.3.6"
description = "Django integration for HeeRanjID distributed ID generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Tarunvir Bains" },
]
keywords = ["django", "distributed", "id", "uuid", "heerid"]
dependencies = [
    "heeranjid",
    "django>=4.2",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
]

[project.urls]
Homepage = "https://github.com/TarunvirBains/HeeRanjID"
Repository = "https://github.com/TarunvirBains/HeeRanjID"
Issues = "https://github.com/TarunvirBains/HeeRanjID/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/heeranjid_django"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
