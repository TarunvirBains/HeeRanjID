[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heeranjid-django"
version = "0.1.0"
description = "Django integration for HeeRanjID distributed ID generation"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "heeranjid",
    "django>=4.2",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
]

readme = "../../README.md"

[project.urls]
Homepage = "https://github.com/TarunvirBains/HeeRanjID"
Repository = "https://github.com/TarunvirBains/HeeRanjID"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/heeranjid_django"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
